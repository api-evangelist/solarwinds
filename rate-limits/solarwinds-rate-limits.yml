specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: SolarWinds
providerId: solarwinds
created: '2026-05-04'
modified: '2026-05-05'
reconciled: false
tags:
  - Observability
  - IT Management
  - Rate Limiting
description: SolarWinds spans a multi-product portfolio with both customer-deployed (Orion-based NPM,
  NCM, IPAM, SAM, DPA, Web Help Desk) and SaaS (Observability, Service Desk, Pingdom, Loggly, Papertrail,
  AppOptics) APIs. Rate limits vary per service and are documented in each product's developer reference
  page; SolarWinds does not publish a single platform-wide rate-limit policy.
sources:
  - https://www.solarwinds.com/
notes: SolarWinds documentation hosts (documentation.solarwinds.com, dev.solarwinds.com) returned 403/404
  to automated retrieval, so per-service rate-limit numbers could not be reconciled. Customer-deployed
  Orion-based products are bound by host capacity rather than a published per-second cap.
responseCodes:
  throttled: 429
limits:
  - name: Per-service SolarWinds API limits
    scope: account/region/service
    metric: varies
    limit: 'see service-specific developer documentation'
    notes: Each SolarWinds product (Observability, Service Desk, Pingdom, Loggly, Papertrail, Orion-based
      products) publishes its own limits and headers in its developer docs.
policies:
  - name: Multi-product portfolio
    description: Rate-limit numbers and headers vary materially by product. Pingdom and Loggly publish
      tier-based throughput limits; Orion-based on-prem APIs are bound by the customer's Information Service
      capacity. Reconcile against the specific product the consumer is calling.
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com
    url: https://apievangelist.com
