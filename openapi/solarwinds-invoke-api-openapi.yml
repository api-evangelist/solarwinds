openapi: 3.2.0
info:
  title: SolarWinds Orion Platform Invoke API
  description: RESTful API for managing and monitoring network devices, servers, and applications through the SolarWinds Orion Platform. Provides access to the SolarWinds Information Service (SWIS) using SWQL queries and CRUD operations on monitored entities via REST/JSON endpoints.
  version: '3'
  contact:
    name: SolarWinds Support
    url: https://support.solarwinds.com
  termsOfService: https://www.solarwinds.com/legal/terms
servers:
- url: https://{orion-server}:17774/SolarWinds/InformationService/v3/Json
  description: Orion Platform Server (port 17774 since 2023.1 release)
  variables:
    orion-server:
      default: localhost
      description: Hostname or IP of your Orion server
security:
- basicAuth: []
tags:
- name: Invoke
  description: Invoke verbs (methods) on SWIS entities
paths:
  /Invoke/{entityType}/{verb}:
    post:
      operationId: invokeVerb
      summary: Solarwinds Invoke a Verb on an Entity Type
      description: Invokes a named verb (method) on the specified entity type. Verbs provide operations like Unmanage, Remanage, PollNow, and other management actions on monitored objects.
      tags:
      - Invoke
      parameters:
      - $ref: '#/components/parameters/EntityType'
      - name: verb
        in: path
        required: true
        description: Name of the verb to invoke
        schema:
          type: string
        example: Unmanage
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
              description: Arguments to pass to the verb
            examples:
              InvokeverbRequestExample:
                summary: Default invokeVerb request
                x-microcks-default: true
                value:
                - {}
      responses:
        '200':
          description: Verb invoked successfully
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
              examples:
                Invokeverb200Example:
                  summary: Default invokeVerb 200 response
                  x-microcks-default: true
                  value: {}
        '400':
          description: Invalid verb arguments
        '401':
          description: Authentication required
        '404':
          description: Entity type or verb not found
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
components:
  parameters:
    EntityType:
      name: entityType
      in: path
      required: true
      description: Fully qualified SWIS entity type name
      schema:
        type: string
      example: Orion.Nodes
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: HTTP Basic authentication using Orion Platform credentials
externalDocs:
  description: SolarWinds Orion Platform API Documentation
  url: https://documentation.solarwinds.com/en/success_center/orionplatform/content/core-swis-api.htm
