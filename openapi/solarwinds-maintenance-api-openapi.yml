openapi: 3.1.0
info:
  title: SolarWinds Loggly Account Maintenance API
  description: RESTful API for cloud-based log management including event submission, event retrieval, search, and account management. Supports sending events over HTTP/S and retrieving log data via paginating event retrieval endpoints.
  version: '2'
  contact:
    name: SolarWinds Support
    url: https://support.solarwinds.com
  termsOfService: https://www.solarwinds.com/legal/terms
servers:
- url: https://{subdomain}.loggly.com/apiv2
  description: Loggly API Server
  variables:
    subdomain:
      default: logs-01
      description: Your Loggly subdomain
security:
- bearerAuth: []
tags:
- name: Maintenance
  description: Manage maintenance windows
paths:
  /maintenance:
    get:
      operationId: listMaintenanceWindows
      summary: Solarwinds List Maintenance Windows
      description: Returns all maintenance windows configured in the account.
      tags:
      - Maintenance
      responses:
        '200':
          description: List of maintenance windows
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaintenanceList'
              examples:
                Listmaintenancewindows200Example:
                  summary: Default listMaintenanceWindows 200 response
                  x-microcks-default: true
                  value:
                    maintenance:
                    - id: abc123
                      description: A sample description.
                      from: 10
                      to: 10
                      checks: example_value
        '401':
          description: Unauthorized
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
components:
  schemas:
    MaintenanceList:
      type: object
      properties:
        maintenance:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              description:
                type: string
              from:
                type: integer
              to:
                type: integer
              checks:
                type: object
          example: []
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: API token for authentication via Authorization Bearer header
    customerToken:
      type: apiKey
      in: path
      name: token
      description: Customer token for event submission endpoints
externalDocs:
  description: Loggly API Documentation
  url: https://documentation.solarwinds.com/en/success_center/loggly/content/admin/api-overview.htm
