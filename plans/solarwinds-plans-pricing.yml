specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: SolarWinds
providerId: solarwinds
created: '2026-05-04'
modified: '2026-05-05'
reconciled: false
tags:
  - Application Monitoring
  - Database Monitoring
  - IT Management
  - Observability
description: SolarWinds sells a broad portfolio (Observability, Hybrid Cloud Observability, Service Desk,
  Database Performance Analyzer, Pingdom, Loggly, Papertrail, NPM, IPAM, NCM, SAM, AppOptics) under a
  mix of perpetual licenses and subscription SKUs. solarwinds.com publicly directs prospects to "Get
  a quote" / Contact Sales for most products; specific list prices are not consistently published. Pingdom
  and Papertrail historically have published self-serve tier pricing, but the broader catalog is contact-sales.
sources:
  - https://www.solarwinds.com/
notes: solarwinds.com/pricing and product pricing pages returned 403 to automated retrieval, so per-product
  list prices could not be reconciled. Trimmed to a single Contact Sales plan referencing the legal entity;
  reconciled is false. Update once a product-specific price page is fetched and parsed.
plans:
  - id: solarwinds-contact-sales
    name: Contact Sales
    type: enterprise
    description: Custom-quoted SolarWinds subscription / perpetual license. SKUs are sized to monitored
      element / node / host count and product mix (Observability, Service Desk, DPA, Pingdom, Loggly,
      Papertrail, NPM, NCM, IPAM, SAM, AppOptics). Quotes are issued by SolarWinds sales or an authorized
      reseller.
    entries:
      - label: Subscription / License
        name: subscription_or_license
        type: subscription
        metric: varies
        limit: -1
        timeFrame: year
        geo: global
        unit: 1
        price: contact sales
        userMultiplied: false
    elements:
      - name: SolarWinds Observability
      - name: SolarWinds Hybrid Cloud Observability
      - name: SolarWinds Service Desk
      - name: SolarWinds Database Performance Analyzer
      - name: SolarWinds Pingdom
      - name: SolarWinds Loggly
      - name: SolarWinds Papertrail
      - name: SolarWinds NPM / NCM / IPAM / SAM
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com
    url: https://apievangelist.com
