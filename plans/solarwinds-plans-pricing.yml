description: Machine-readable plans and pricing scaffold for this API provider. Conforms to the API Commons
  Plans schema. Tier limits and prices are scaffold defaults; replace with provider-published values.
plans:
  - id: solarwinds-free
    name: Free
    type: freemium
    description: Free entry tier for the SolarWinds API surface. Intended for evaluation, prototyping,
      and low-volume integrations. Real limits and pricing must be reconciled with the provider's published
      plan documentation.
    entries:
      - label: API Requests
        description: Monthly API request quota across all included endpoints
        name: api_requests
        type: quota
        metric: requests
        limit: 1000
        timeFrame: month
        geo: global
        domains:
          - https://{orion-server}:17778/SolarWinds/InformationService/v3
          - https://{instance}.samanage.com/api
          - https://api.na-01.cloud.solarwinds.com
          - https://{dpa-server}:8124/iwc/api
          - https://{npm-server}:17778/SolarWinds/InformationService/v3
          - https://{whd-server}/helpdesk/WebObjects/Helpdesk.woa/ra
          - https://api.pingdom.com/api/3.1
          - https://{subdomain}.loggly.com/apiv2
          - https://papertrailapp.com/api/v1
          - https://api.appoptics.com/v1
        unit: 1
        price: '0.00'
        userMultiplied: false
      - label: Rate Limit
        description: Maximum requests per minute on the free tier
        name: rate_limit
        type: rate
        metric: requests_per_minute
        limit: 10
        timeFrame: minute
        geo: global
        domains:
