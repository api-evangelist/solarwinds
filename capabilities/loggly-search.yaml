naftiko: 1.0.0-alpha2
info:
  label: SolarWinds Loggly API — Search
  description: 'SolarWinds Loggly API — Search. 3 operations. Lead operation: Solarwinds Retrieve Search Results. Self-contained
    Naftiko capability covering one Solarwinds business surface.'
  tags:
  - Solarwinds
  - Search
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SOLARWINDS_API_KEY: SOLARWINDS_API_KEY
capability:
  consumes:
  - type: http
    namespace: loggly-search
    baseUri: https://{subdomain}.loggly.com/apiv2
    description: SolarWinds Loggly API — Search business capability. Self-contained, no shared references.
    resources:
    - name: events
      path: /events
      operations:
      - name: getevents
        method: GET
        description: Solarwinds Retrieve Search Results
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: rsid
          in: query
          type: string
          description: Result Set ID from the search endpoint
          required: true
    - name: events-iterate
      path: /events/iterate
      operations:
      - name: iterateevents
        method: GET
        description: Solarwinds Iterate Through Search Results
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: rsid
          in: query
          type: string
          description: Result Set ID from the search endpoint
          required: true
        - name: next
          in: query
          type: string
          description: Pagination cursor for next page
    - name: search
      path: /search
      operations:
      - name: searchevents
        method: GET
        description: Solarwinds Initiate a Search Query
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: q
          in: query
          type: string
          description: Search query string using Loggly search syntax
          required: true
        - name: from
          in: query
          type: string
          description: Start time for search (ISO 8601 or relative like -24h)
        - name: until
          in: query
          type: string
          description: End time for search
        - name: size
          in: query
          type: integer
          description: Maximum number of events to return
        - name: order
          in: query
          type: string
          description: Sort order
    authentication:
      type: bearer
      token: '{{env.SOLARWINDS_API_KEY}}'
  exposes:
  - type: rest
    namespace: loggly-search-rest
    port: 8080
    description: REST adapter for SolarWinds Loggly API — Search. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/events
      name: events
      description: REST surface for events.
      operations:
      - method: GET
        name: getevents
        description: Solarwinds Retrieve Search Results
        call: loggly-search.getevents
        with:
          rsid: rest.rsid
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/events/iterate
      name: events-iterate
      description: REST surface for events-iterate.
      operations:
      - method: GET
        name: iterateevents
        description: Solarwinds Iterate Through Search Results
        call: loggly-search.iterateevents
        with:
          rsid: rest.rsid
          next: rest.next
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/search
      name: search
      description: REST surface for search.
      operations:
      - method: GET
        name: searchevents
        description: Solarwinds Initiate a Search Query
        call: loggly-search.searchevents
        with:
          q: rest.q
          from: rest.from
          until: rest.until
          size: rest.size
          order: rest.order
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: loggly-search-mcp
    port: 9090
    transport: http
    description: MCP adapter for SolarWinds Loggly API — Search. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: solarwinds-retrieve-search-results
      description: Solarwinds Retrieve Search Results
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: loggly-search.getevents
      with:
        rsid: tools.rsid
      outputParameters:
      - type: object
        mapping: $.
    - name: solarwinds-iterate-through-search-results
      description: Solarwinds Iterate Through Search Results
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: loggly-search.iterateevents
      with:
        rsid: tools.rsid
        next: tools.next
      outputParameters:
      - type: object
        mapping: $.
    - name: solarwinds-initiate-search-query
      description: Solarwinds Initiate a Search Query
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: loggly-search.searchevents
      with:
        q: tools.q
        from: tools.from
        until: tools.until
        size: tools.size
        order: tools.order
      outputParameters:
      - type: object
        mapping: $.
