naftiko: 1.0.0-alpha2
info:
  label: SolarWinds Orion Platform API — CRUD
  description: 'SolarWinds Orion Platform API — CRUD. 4 operations. Lead operation: Solarwinds Create a New Swis Entity. Self-contained
