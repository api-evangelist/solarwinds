naftiko: 1.0.0-alpha2
info:
  label: SolarWinds Papertrail API — Users
  description: 'SolarWinds Papertrail API — Users. 1 operations. Lead operation: Solarwinds List Users. Self-contained Naftiko
    capability covering one Solarwinds business surface.'
  tags:
  - Solarwinds
  - Users
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SOLARWINDS_API_KEY: SOLARWINDS_API_KEY
capability:
  consumes:
  - type: http
    namespace: papertrail-users
    baseUri: https://papertrailapp.com/api/v1
    description: SolarWinds Papertrail API — Users business capability. Self-contained, no shared references.
    resources:
    - name: users.json
      path: /users.json
      operations:
      - name: listusers
        method: GET
        description: Solarwinds List Users
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: apikey
      key: X-Papertrail-Token
      value: '{{env.SOLARWINDS_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: papertrail-users-rest
    port: 8080
    description: REST adapter for SolarWinds Papertrail API — Users. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/users-json
      name: users-json
      description: REST surface for users.json.
      operations:
      - method: GET
        name: listusers
        description: Solarwinds List Users
        call: papertrail-users.listusers
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: papertrail-users-mcp
    port: 9090
    transport: http
    description: MCP adapter for SolarWinds Papertrail API — Users. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: solarwinds-list-users
      description: Solarwinds List Users
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: papertrail-users.listusers
      outputParameters:
      - type: object
        mapping: $.
