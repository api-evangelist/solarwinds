naftiko: 1.0.0-alpha2
info:
  label: SolarWinds Log Management
  description: Workflow for centralized log management combining Loggly cloud log aggregation with Papertrail log search and
    system management for DevOps and operations teams.
  tags:
  - SolarWinds
  - Log Management
  - Loggly
  - Papertrail
  created: '2026-04-18'
  modified: '2026-05-06'
binds:
- namespace: env
  keys:
    LOGGLY_API_TOKEN: LOGGLY_API_TOKEN
    PAPERTRAIL_API_TOKEN: PAPERTRAIL_API_TOKEN
capability:
  consumes:
  - type: http
    namespace: loggly
    baseUri: https://logs-01.loggly.com/apiv2
    description: Loggly API for log search and retrieval
    authentication:
      type: bearer
      token: '{{LOGGLY_API_TOKEN}}'
    resources:
    - name: search
      path: /search
      description: Log search
      operations:
      - name: search-events
        method: GET
        description: Initiate a log search query
        inputParameters:
        - name: q
          in: query
          type: string
          required: true
          description: Search query string
        - name: from
          in: query
          type: string
          required: false
          description: Start time
        - name: until
          in: query
          type: string
          required: false
          description: End time
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: get-events
        method: GET
        description: Retrieve search results
        inputParameters:
        - name: rsid
          in: path
          type: string
          required: true
          description: Search result set ID
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: account
      path: /customer
      description: Account management
      operations:
      - name: get-account-info
        method: GET
        description: Get account information
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  - type: http
    namespace: papertrail
    baseUri: https://papertrailapp.com/api/v1
    description: Papertrail HTTP API for log management
    authentication:
      type: apikey
      key: X-Papertrail-Token
      value: '{{PAPERTRAIL_API_TOKEN}}'
      placement: header
    resources:
    - name: events
      path: /events/search.json
      description: Log event search
      operations:
      - name: search-events
        method: GET
        description: Search log events
        inputParameters:
        - name: q
          in: query
          type: string
          required: false
          description: Search query
        - name: system_id
          in: query
          type: integer
          required: false
          description: Filter by system
        - name: group_id
          in: query
          type: integer
          required: false
          description: Filter by group
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: systems
      path: /systems.json
      description: System management
      operations:
      - name: list-systems
        method: GET
        description: List log-sending systems
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: create-system
        method: POST
        description: Register a new system
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        body:
          type: json
          data:
            system:
              name: '{{tools.name}}'
    - name: groups
      path: /groups.json
      description: Group management
      operations:
      - name: list-groups
        method: GET
        description: List system groups
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: saved-searches
      path: /searches.json
      description: Saved search management
      operations:
      - name: list-saved-searches
        method: GET
        description: List saved searches
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    port: 8081
    namespace: log-management-api
    description: Unified REST API for SolarWinds log management.
    resources:
    - path: /v1/loggly-search
      name: loggly-search
      description: Loggly log search
      operations:
      - method: GET
        name: loggly-search-events
        description: Search Loggly log events
        call: loggly.search-events
        with:
          q: rest.q
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/papertrail-search
      name: papertrail-search
      description: Papertrail log search
      operations:
      - method: GET
        name: papertrail-search-events
        description: Search Papertrail log events
        call: papertrail.search-events
        with:
          q: rest.q
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/systems
      name: systems
      description: Papertrail system management
      operations:
      - method: GET
        name: list-systems
        description: List log-sending systems
        call: papertrail.list-systems
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    port: 9091
    namespace: log-management-mcp
    transport: http
    description: MCP server for AI-assisted log management.
    tools:
    - name: loggly-search
      description: Search Loggly log events
      hints:
        readOnly: true
      call: loggly.search-events
      with:
        q: tools.q
      outputParameters:
      - type: object
        mapping: $.
    - name: loggly-get-events
      description: Retrieve Loggly search results by RSID
      hints:
        readOnly: true
      call: loggly.get-events
      with:
        rsid: tools.rsid
      outputParameters:
      - type: object
        mapping: $.
    - name: loggly-get-account-info
      description: Get Loggly account information
      hints:
        readOnly: true
      call: loggly.get-account-info
      outputParameters:
      - type: object
        mapping: $.
    - name: papertrail-search
      description: Search Papertrail log events
      hints:
        readOnly: true
      call: papertrail.search-events
      with:
        q: tools.q
      outputParameters:
      - type: object
        mapping: $.
    - name: papertrail-list-systems
      description: List Papertrail log-sending systems
      hints:
        readOnly: true
      call: papertrail.list-systems
      outputParameters:
      - type: object
        mapping: $.
    - name: papertrail-list-groups
      description: List Papertrail system groups
      hints:
        readOnly: true
      call: papertrail.list-groups
      outputParameters:
      - type: object
        mapping: $.
    - name: papertrail-list-saved-searches
      description: List Papertrail saved searches
      hints:
        readOnly: true
      call: papertrail.list-saved-searches
      outputParameters:
      - type: object
        mapping: $.
