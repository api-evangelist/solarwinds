naftiko: 1.0.0-alpha2
info:
  label: SolarWinds IT Service Management
  description: Workflow for IT service management combining Service Desk incident/change management with Orion infrastructure
    data for IT support and service delivery teams.
  tags:
  - SolarWinds
  - ITSM
  - Service Desk
  - Incident Management
  created: '2026-04-18'
  modified: '2026-05-06'
binds:
- namespace: env
  keys:
    SWSD_API_TOKEN: SWSD_API_TOKEN
    ORION_USERNAME: ORION_USERNAME
    ORION_PASSWORD: ORION_PASSWORD
capability:
  consumes:
  - type: http
    namespace: service-desk
    baseUri: https://api.samanage.com
    description: SolarWinds Service Desk REST API
    authentication:
      type: bearer
      token: '{{SWSD_API_TOKEN}}'
    resources:
    - name: incidents
      path: /incidents.json
      description: Incident management
      operations:
      - name: list-incidents
        method: GET
        description: List incidents
        inputParameters:
        - name: page
          in: query
          type: integer
          required: false
          description: Page number
        - name: per_page
          in: query
          type: integer
          required: false
          description: Items per page
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: create-incident
        method: POST
        description: Create an incident
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        body:
          type: json
          data:
            incident:
              name: '{{tools.name}}'
              description: '{{tools.description}}'
      - name: get-incident
        method: GET
        description: Get incident details
        inputParameters:
        - name: incidentId
          in: path
          type: integer
          required: true
          description: Incident ID
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: update-incident
        method: PUT
        description: Update an incident
        inputParameters:
        - name: incidentId
          in: path
          type: integer
          required: true
          description: Incident ID
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: service-requests
      path: /service_requests.json
      description: Service request management
      operations:
      - name: list-service-requests
        method: GET
        description: List service requests
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: create-service-request
        method: POST
        description: Create a service request
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: changes
      path: /changes.json
      description: Change management
      operations:
      - name: list-changes
        method: GET
        description: List change requests
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: assets
      path: /hardwares.json
      description: Asset management
      operations:
      - name: list-assets
        method: GET
        description: List hardware assets
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  - type: http
    namespace: orion
    baseUri: https://localhost:17774/SolarWinds/InformationService/v3/Json
    description: SolarWinds Orion Platform SWIS REST API
    authentication:
      type: basic
      username: '{{ORION_USERNAME}}'
      password: '{{ORION_PASSWORD}}'
    resources:
    - name: query
      path: /Query
      description: SWQL query execution
      operations:
      - name: query-swis
        method: GET
        description: Execute a SWQL query
        inputParameters:
        - name: query
          in: query
          type: string
          required: true
          description: SWQL query string
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: crud
      path: /
      description: CRUD operations on SWIS entities
      operations:
      - name: create-entity
        method: POST
        description: Create a SWIS entity
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: read-entity
        method: GET
        description: Read a SWIS entity
        inputParameters:
        - name: uri
          in: path
          type: string
          required: true
          description: SWIS entity URI
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: update-entity
        method: POST
        description: Update a SWIS entity
        inputParameters:
        - name: uri
          in: path
          type: string
          required: true
          description: SWIS entity URI
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: delete-entity
        method: DELETE
        description: Delete a SWIS entity
        inputParameters:
        - name: uri
          in: path
          type: string
          required: true
          description: SWIS entity URI
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: invoke-verb
        method: POST
        description: Invoke a verb on a SWIS entity
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: bulk
      path: /BulkDelete
      description: Bulk operations
      operations:
      - name: bulk-delete
        method: POST
        description: Delete multiple SWIS entities
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    port: 8082
    namespace: itsm-api
    description: Unified REST API for SolarWinds IT service management.
    resources:
    - path: /v1/incidents
      name: incidents
      description: Incident management
      operations:
      - method: GET
        name: list-incidents
        description: List incidents
        call: service-desk.list-incidents
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/service-requests
      name: service-requests
      description: Service request management
      operations:
      - method: GET
        name: list-service-requests
        description: List service requests
        call: service-desk.list-service-requests
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/changes
      name: changes
      description: Change management
      operations:
      - method: GET
        name: list-changes
        description: List change requests
        call: service-desk.list-changes
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/assets
      name: assets
      description: Asset management
      operations:
      - method: GET
        name: list-assets
        description: List hardware assets
        call: service-desk.list-assets
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    port: 9092
    namespace: itsm-mcp
    transport: http
    description: MCP server for AI-assisted IT service management.
    tools:
    - name: list-incidents
      description: List service desk incidents
      hints:
        readOnly: true
      call: service-desk.list-incidents
      outputParameters:
      - type: object
        mapping: $.
    - name: get-incident
      description: Get incident details
      hints:
        readOnly: true
      call: service-desk.get-incident
      with:
        incidentId: tools.incidentId
      outputParameters:
      - type: object
        mapping: $.
    - name: create-incident
      description: Create a new incident
      hints:
        readOnly: false
      call: service-desk.create-incident
      outputParameters:
      - type: object
        mapping: $.
    - name: list-service-requests
      description: List service requests
      hints:
        readOnly: true
      call: service-desk.list-service-requests
      outputParameters:
      - type: object
        mapping: $.
    - name: list-changes
      description: List change requests
      hints:
        readOnly: true
      call: service-desk.list-changes
      outputParameters:
      - type: object
        mapping: $.
    - name: list-assets
      description: List hardware assets
      hints:
        readOnly: true
      call: service-desk.list-assets
      outputParameters:
      - type: object
        mapping: $.
    - name: query-infrastructure
      description: Query Orion infrastructure data via SWQL
      hints:
        readOnly: true
      call: orion.query-swis
      with:
        query: tools.query
      outputParameters:
      - type: object
        mapping: $.
