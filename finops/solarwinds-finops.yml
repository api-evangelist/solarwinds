meters:
  - name: monitored_elements
    unit: element
    aggregation: max
    dimensions:
      - product
      - environment
  - name: ingested_log_volume
    unit: GB
    aggregation: sum
    dimensions:
      - product
      - source
  - name: monitored_database_instances
    unit: instance
    aggregation: max
    dimensions:
      - dbms
  - name: synthetic_checks
    unit: check
    aggregation: count
    dimensions:
      - region
      - check_type
  - name: service_desk_agents
    unit: agent
    aggregation: max
    dimensions:
      - tier
principles:
  - name: Visibility
    description: Use SolarWinds Observability dashboards plus per-product reporting (DPA, Service Desk
      analytics, Pingdom reports, Loggly/Papertrail volume views) to surface consumption per product family.
  - name: Allocation
    description: Tag monitored elements, log sources, and Service Desk requesters to business units; allocate
      Orion node licenses to the systems they monitor.
  - name: Optimization
    description: Retire stale monitors, archive cold log streams off Loggly/Papertrail, right-size Pingdom
      check frequency, and consolidate Orion modules where the same hosts are monitored by multiple SKUs.
  - name: Accountability
    description: Platform owner reconciles per-product entitlement (node count, log GB, agent count) against
      SolarWinds invoices and renewal quotes each cycle.
