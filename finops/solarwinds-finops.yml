description: 'FOCUS-aligned FinOps placeholder for SolarWinds. The portfolio mixes perpetual licenses
  (Orion-based products) and SaaS subscriptions (Observability, Service Desk, Pingdom, Loggly, Papertrail);
  meters reflect the consumption shape customers should track per product.'
sources:
  - https://www.solarwinds.com/
notes: SolarWinds publishes per-product pricing only via Contact Sales / quote-based channels and online
  pricing pages were not retrievable. FOCUS unit prices cannot be reconciled here; meters describe consumption
  shape per major product (monitored elements, ingested log volume, monitored database instances, synthetic
  checks).
